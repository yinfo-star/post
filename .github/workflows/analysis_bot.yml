name: Steem Daily Analysis Bot

on:
  schedule:
    - cron: '0 10 * * *'   # Her gün saat 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analysis-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Analysis Bot
        env:
          STEEM_USERNAME: ${{ secrets.STEEM_USERNAME }}
          STEEM_POSTING_KEY: ${{ secrets.STEEM_POSTING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python analysis_bot.py
